name: gatehouse

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gatehouse}
      POSTGRES_USER: ${POSTGRES_USER:-gatehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gatehouse_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
  postgres-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
        POSTGRES_DB: gatehouse_test
        POSTGRES_USER: gatehouse
        POSTGRES_PASSWORD: gatehouse_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data: