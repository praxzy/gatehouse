name: PR quality gates

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  application-checks:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            examples/employee-portal/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.7.0

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Run application checks
        run: make check

      - name: Stop test services
        if: always()
        run: docker compose --profile test down --volumes

  browser-tests:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            examples/employee-portal/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.7.0

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: make test-e2e

      - name: Stop test services
        if: always()
        run: docker compose --profile test down --volumes

  terraform-checks:
    name: Terraform checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Configure Terraform provider cache
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-plugin-cache" >> "$GITHUB_ENV"

      - name: Run formatting, validation, and mock plans
        run: make terraform-check

  container-checks:
    name: Container checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build API image
        run: docker build --target api --tag gatehouse-api:ci backend

      - name: Build worker image
        run: docker build --target audit-export-worker --tag gatehouse-audit-export-worker:ci backend

      - name: Verify image identities and entrypoints
        run: |
          test "$(docker image inspect gatehouse-api:ci --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect gatehouse-api:ci --format '{{json .Config.Entrypoint}}')" = '["/gatehouse-api"]'

          test "$(docker image inspect gatehouse-audit-export-worker:ci --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect gatehouse-audit-export-worker:ci --format '{{json .Config.Entrypoint}}')" = '["/audit-export-worker"]'

      - name: Verify API fails closed without configuration
        run: |
          if docker run --rm \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            gatehouse-api:ci >api-startup.log 2>&1
          then
            echo "API unexpectedly started without configuration"
            exit 1
          fi

          grep -F "DATABASE_URL is required" api-startup.log

      - name: Verify worker fails closed without configuration
        run: |
          if docker run --rm \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            gatehouse-audit-export-worker:ci >worker-startup.log 2>&1
          then
            echo "Worker unexpectedly started without configuration"
            exit 1
          fi

          grep -F \
            "DATABASE_URL, AUDIT_EXPORT_QUEUE_URL, and AUDIT_EXPORT_BUCKET are required" \
            worker-startup.log
